<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>L&T Açaí</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>L&T Açaí</h1>
      <p>Monte seu Açaí 🍇</p>
    </header>

    <div class="container">
      <h2>Cardápio</h2>

      <div class="menu">
        <div class="produto">
          <img src="img/Acai300ml.jpeg" alt="Açaí 300ml" />

          <h3>Açaí 300ml</h3>

          <p>R$12,00</p>
        </div>

        <div class="produto">
          <img src="img/Acai500ml.jpeg" alt="Açaí 500ml" />

          <h3>Açaí 500ml</h3>

          <p>R$16,00</p>
        </div>

        <div class="produto">
          <img src="img/Acai700ml.jpeg" alt="Açaí 700ml" />

          <h3>Açaí 700ml</h3>

          <p>R$20,00</p>
        </div>

        <div class="produto">
          <img src="img/Acai1ltro.jpeg" alt="Açaí 1 Litro" />

          <h3>Açaí 1 Litro</h3>

          <p>R$24,99</p>
        </div>

        <div class="produto">
          <img src="img/AcaiFamilia.jpeg" alt="Açaí Família" />

          <h3>Açaí 1 Litro Família</h3>

          <p>R$29,99</p>
        </div>
      </div>

      <h2>Monte seu Açaí</h2>

      <h3>Tamanho</h3>

      <label>
        <input type="radio" name="tamanho" value="Açaí 300ml|12" />
        AÇAÍ 300ml - R$12,00
      </label>

      <label>
        <input type="radio" name="tamanho" value="Açaí 500ml|16" />
        AÇAÍ 500ml - R$16,00
      </label>

      <label>
        <input type="radio" name="tamanho" value="Açaí 700ml|20" />
        AÇAÍ 700ml - R$20,00
      </label>

      <label>
        <input type="radio" name="tamanho" value="Açaí 1L|24.99" />
        AÇAÍ 1 Litro - R$24,99
      </label>

      <h3>Complementos</h3>

      <label><input type="checkbox" value="Amendoim" /> Amendoim</label>
      <label><input type="checkbox" value="Choco Ball" /> Choco Ball</label>
      <label><input type="checkbox" value="Sucrilhos" /> Sucrilhos</label>
      <label
        ><input type="checkbox" value="Flocos de arroz" /> Flocos de
        arroz</label
      >
      <label><input type="checkbox" value="Granola" /> Granola</label>
      <label><input type="checkbox" value="Jujuba" /> Jujuba</label>
      <label><input type="checkbox" value="Aveia" /> Aveia</label>
      <label><input type="checkbox" value="Biscoito" /> Biscoito</label>

      <h3>Caldas</h3>

      <label><input type="checkbox" value="Calda de morango" /> Morango</label>
      <label
        ><input type="checkbox" value="Leite condensado" /> Leite
        condensado</label
      >
      <label><input type="checkbox" value="Calda de uva" /> Uva</label>
      <label
        ><input type="checkbox" value="Calda de chocolate" /> Chocolate</label
      >

      <h3>Adicionais</h3>

      <label>
        <input type="checkbox" value="Leite em pó|2" />
        Leite em pó (+R$2,00)
      </label>

      <label>
        <input type="checkbox" value="Banana|2.5" />
        Banana (+R$2,50)
      </label>

      <label>
        <input type="checkbox" value="Morango|2.5" />
        Morango (+R$2,50)
      </label>

      <div class="total">Total: R$ <span id="total">0.00</span></div>

      <button onclick="enviarPedido()">Fazer Pedido</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
